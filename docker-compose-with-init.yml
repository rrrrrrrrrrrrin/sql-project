services:
  postgres:
    image: postgres:17-alpine
    container_name: gamestore_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gamestore
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data 
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro 

  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: gamestore_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: 0arinaberdieva@gmail.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - postgres