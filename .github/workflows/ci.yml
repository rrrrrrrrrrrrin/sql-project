name: GameStore CI

# Run checks on push and pull requests, and manual execution
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

  # Allow manual execution of the workflow from GitHub Actions tab
  workflow_dispatch:  

# Give the workflow read-only repository access
permissions:
  contents: read

jobs:

  # Check and build for React frontend
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Check Python backend
  backend:
    name: Backend check
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

          # Avoid downloading all dependencies on every run 
          # when the lockfile or requirements have not changed
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

      # Backend tests
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          JWT_SECRET_KEY: "test-secret-key-for-ci"
        run: python -m pytest -v
        