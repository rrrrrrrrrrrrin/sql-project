name: GameStore CI

# Run checks on push and pull requests, and manual execution
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

  # Allow manual execution of the workflow from GitHub Actions tab
  workflow_dispatch:  

# Give the workflow read-only repository access
permissions:
  contents: read

jobs:

  # Check and build for React frontend
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Check Python backend
  backend:
    name: Backend check
    runs-on: ubuntu-latest

    # Start a temporary PostgreSQL container for testing
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gamestore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gamestore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Environment variables for integration tests
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test_password@localhost:5432/gamestore_test
      JWT_SECRET_KEY: pytest-only-secrSet

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

          # Avoid downloading all dependencies on every run 
          # when the lockfile or requirements have not changed
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend
        
      # Initialize the test database schema before running integration tests
      - name: Initialize test database schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg2
          from sqlalchemy.engine import make_url

          # Locate and read the SQL initialization file
          schema_path = Path("database/init.sql").resolve()

          if not schema_path.is_file():
              raise FileNotFoundError(
                  f"Database schema not found: {schema_path}"
              )

          schema_sql = schema_path.read_text(encoding="utf-8")

          print(f"Initializing schema from: {schema_path}")
          print(f"SQL file size: {len(schema_sql)} characters")

          # Connect only to the dedicated test database
          url = make_url(os.environ["TEST_DATABASE_URL"])

          if url.database != "gamestore_test":
              raise RuntimeError("Refusing to initialize a non-test database!")

          connection = psycopg2.connect(
              dbname=url.database,
              user=url.username,
              password=url.password,
              host=url.host,
              port=url.port or 5432
          )

          try:
              # Execute the complete SQL schema
              with connection.cursor() as cursor:
                  cursor.execute(schema_sql)

              connection.commit()

              # Verify that all expected tables were created
              required_tables = {
                  "accounts",
                  "games",
                  "dlcs",
                  "library",
                  "game_reviews",
                  "developers",
                  "publishers",
                  "game_developers",
                  "game_publishers"
              }

              with connection.cursor() as cursor:
                  cursor.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                  """)

                  existing_tables = {
                      row[0] for row in cursor.fetchall()
                  }

              missing_tables = required_tables - existing_tables

              if missing_tables:
                  raise RuntimeError(
                      f"Missing tables: {sorted(missing_tables)}"
                  )

              print("All 9 database tables initialized successfully!")

          finally:
              connection.close()
          PY

      - name: Verify test database schema
        run: |
          python - <<'PY'
          import os
          import psycopg2
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["TEST_DATABASE_URL"])

          connection = psycopg2.connect(
              dbname=url.database,
              user=url.username,
              password=url.password,
              host=url.host,
              port=url.port or 5432
          )

          required_tables = {
              "accounts",
              "games",
              "dlcs",
              "library",
              "game_reviews",
              "developers",
              "publishers",
              "game_developers",
              "game_publishers"
          }

          try:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema = 'public'
                  """)

                  existing_tables = {
                      row[0] for row in cursor.fetchall()
                  }

              missing_tables = required_tables - existing_tables

              if missing_tables:
                  raise RuntimeError(
                      f"Missing database tables: {sorted(missing_tables)}"
                  )

              print("All nine database tables exist!")

          finally:
              connection.close()
          PY

        # Backend tests
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v
