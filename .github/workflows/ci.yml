name: GameStore CI

# Run checks on push and pull requests, and manual execution
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

  # Allow manual execution of the workflow from GitHub Actions tab
  workflow_dispatch:  

# Give the workflow read-only repository access
permissions:
  contents: read

jobs:

  # Check and build for React frontend
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # Check Python backend
  backend:
    name: Backend check
    runs-on: ubuntu-latest

    # Start a temporary PostgreSQL container for testing
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gamestore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gamestore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Environment variables for integration tests
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test_password@localhost:5432/gamestore_test
      JWT_SECRET_KEY: pytest-only-secrSet

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

          # Avoid downloading all dependencies on every run 
          # when the lockfile or requirements have not changed
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

      # Backend tests
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v
        
      # Initialize the test database schema before running integration tests
      - name: Initialize test database schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg2
          from sqlalchemy.engine import make_url

          # Read and verify the test database URL
          url = make_url(os.environ["TEST_DATABASE_URL"])

          if url.database != "gamestore_test":
              raise RuntimeError("Unexpected database name!")

          # Connect to PostgreSQL
          connection = psycopg2.connect(
              dbname=url.database,
              user=url.username,
              password=url.password,
              host=url.host,
              port=url.port or 5432
          )

          try:
              # Execute the database initialization script
              with connection:
                  with connection.cursor() as cursor:
                      schema = Path("database/init.sql")
                      cursor.execute(schema.read_text(encoding="utf-8"))

              print("Test database schema initialized successfully!")

          finally:
              connection.close()
          PY